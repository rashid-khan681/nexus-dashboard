# Single entry point for the whole application (port 80).
#   /socket.io/*  -> backend  (WebSocket upgrade enabled)
#   /api/*        -> backend  (REST API)
#   /health       -> backend  (liveness probe)
#   everything else -> frontend (Next.js)
# The healthd log format below lets Elastic Beanstalk collect enhanced health metrics.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format healthd '$msec"$uri"$status"$request_time"$upstream_response_time"$http_x_forwarded_for';

    upstream frontend_app {
        server frontend:3000;
    }

    upstream backend_app {
        server backend:5000;
    }

    server {
        listen 80 default_server;
        client_max_body_size 1m;

        access_log /var/log/nginx/access.log;

        # Enhanced health reporting for Elastic Beanstalk
        if ($time_iso8601 ~ "^(\d{4})-(\d{2})-(\d{2})T(\d{2})") {
            set $year $1;
            set $month $2;
            set $day $3;
            set $hour $4;
        }
        access_log /var/log/nginx/healthd/application.log.$year-$month-$day-$hour healthd;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        location /socket.io/ {
            proxy_pass http://backend_app;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://backend_app;
        }

        location = /health {
            proxy_pass http://backend_app;
        }

        location / {
            proxy_pass http://frontend_app;
        }
    }
}
