# Local development stack: builds every image from source and serves the app on http://localhost:8080
#   docker compose up --build
# Variables are read from the .env file next to this file (see .env.example).

services:
  database:
    image: postgres:15-alpine
    container_name: nexus_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      # The official image keeps its data in /var/lib/postgresql/data. Mounting the parent
      # folder would silently create an anonymous volume and lose data on recreate.
      - pg_data:/var/lib/postgresql/data
    networks:
      - nexus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: nexus_backend
    restart: unless-stopped
    environment:
      PORT: "5000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      AI_MAX_CALLS_PER_HOUR: ${AI_MAX_CALLS_PER_HOUR:-30}
      RETENTION_DAYS: ${RETENTION_DAYS:-10}
    expose:
      - "5000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - nexus-net

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_MODE: same-origin
    container_name: nexus_frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nexus-net

  nginx-proxy:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
    networks:
      - nexus-net

networks:
  nexus-net:
    driver: bridge

volumes:
  pg_data:
